<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hexe</title>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <b class="brand">hexe</b>
        <input id="path" spellcheck="false" placeholder="scene.json / .ens / .nmc path" />
        <button id="open">Open</button>
        <button id="save">Save</button>
        <button id="new">New</button>
        <span class="sep"></span>
        <label title="W (viewport hover)"><input type="checkbox" id="wire" /> wireframe</label>
        <label><input type="checkbox" id="pts" checked /> points</label>
        <label title="point size">pt <input type="range" id="ptsize" min="1" max="20" value="6" /></label>
<button id="fit" title="H / F">Fit</button><input id="fitx" value="*background*" size="11" title="Fit ignores prim groups matching these globs (comma separated, empty = none)" />
<span class="sep"></span>
<label id="timeline" title="timeline $F: the display cook runs at time = ($F - 1) / fps (motion SOP scrubs its clip)">F <input type="number" id="frame" min="1" max="1000000" step="1" value="1" /> <input type="range" id="frameslider" min="1" max="360" value="1" /> <span id="fpslab">30 fps</span></label>
<button id="play" title="Play: advance $F at the timeline fps (the endosim SOP runs its physics as $F moves); Stop halts">Play</button>
<button id="pick" title="S (viewport hover): pick points - click / drag-box">Pick</button>
<button id="grpsel" title="new group SOP from the picked points" disabled>Group from selection</button>
        <span id="status"></span>
      </header>
      <section id="viewport" class="pane"></section>
      <div id="side">
<section id="params" class="pane"></section>
<section id="sheet" class="pane"></section>
</div>
      <section id="network" class="pane" tabindex="0"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
