[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# internal
hexe-core = { path = "crates/core", version = "0.1.0" }
hexe-geo = { path = "crates/geo", version = "0.1.0" }
hexe-graph = { path = "crates/graph", version = "0.1.0" }
hexe-sop = { path = "crates/sop", version = "0.1.0" }
# ui (apps only: layers.rs forbids UI crates below L7). Switch eframe to `wgpu` when a custom pass is needed.
glam = "0.30"
egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
