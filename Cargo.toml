[workspace]
resolver = "3"
members = ["crates/*", "apps/hexe-cli", "apps/hexe-tauri/src-tauri", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# internal
hexe-core = { path = "crates/core", version = "0.1.0" }
hexe-geo = { path = "crates/geo", version = "0.1.0" }
hexe-graph = { path = "crates/graph", version = "0.1.0" }
hexe-sop = { path = "crates/sop", version = "0.1.0" }
hexe-vex = { path = "crates/vex", version = "0.1.0" }
sop-motion = { path = "crates/sop-motion", version = "0.1.0" }
glam = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
