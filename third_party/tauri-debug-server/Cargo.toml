[package]
name = "tauri-debug-server"
version = "0.1.0"
description = "Scriptable CDP-ish debug door for Tauri apps: POST /eval, GET /console /json /info /screenshot (+ CDP websocket). Lanes drive the UI via JS, never mouse/keyboard."
edition = "2021"
rust-version = "1.77"

[dependencies]
tauri = "2"
serde_json = "1"
tungstenite = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
