# cargo-deny policy. `cargo xtask deny` / part of `cargo xtask ci` (warns when cargo-deny is absent).
# Permissive licences only. Copyleft (GPL, AGPL, LGPL) is never linked: such tools run only as external oracle processes.
[graph]
all-features = true
[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
[licenses.private]
ignore = true
[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
[sources]
unknown-registry = "deny"
unknown-git = "deny"
[advisories]
yanked = "warn"
ignore = []
