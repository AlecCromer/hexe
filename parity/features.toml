  "crates/sop/src/builtins/polybevel_sop.rs::ignoreflat_angle_limit_keeps_90_degree_edges_below_90_and_drops_them_at_90",
  "crates/sop/src/builtins/polybevel_sop.rs::ignoreflat_bad_angle_is_rejected_and_only_checked_when_on",
]
notes = "H22: params group/offset/divisions/filletshape = OUR minimal subset. Bevelable edge = exactly 2 valid closed polys, opposite winding (boundary / non-manifold edges never beveled). offset = in-face perpendicular distance (cube chamfer width = offset*sqrt2). Vertex splits into sectors (corners joined across unbeveled edges) + cap polys for closed sector loops; cube all-edges: div1 = 24 pts/26 prims (6 quads+12 strips+8 tris), div2 = 48/38 (8 hexagon caps). round = conic arc w=sin(theta/2) (exact circle at 90deg), solid = straight profile. Group = 'a-b' edge pairs or point groups (both ends in group); grouptype implicit (no parm). Point attrs copy source vertex (profile pts too), strips inherit first face prim attrs, existing N (point/vertex/prim) recomputed flat/uniform. LIMITS: a lone beveled edge (vertex with 1 beveled edge) tapers = no strip (selection needs loops/ends meeting 2+ beveled edges); no uv fix-up, per-edge offset, offset-collision cleanup. QA: ignoreflat(B off)+flatangle(F deg, 1) = edges with dihedral <= flatangle skipped (cube 90deg: 89 keeps 24/26, 90 drops all; parm names UNVERIFIED). REMAINING: lone-edge strip taper, valence>3 fan, uv fix-up, per-edge offset, offset-collision cleanup. UNVERIFIED-vs-Houdini: grouptype parm (we infer edges/points from group pattern), valence>3 cap triangulation (no oracle). Example: examples/polybevel.json. Analytical oracle only. Houdini-oracle (H32, real Houdini 20.5): COUNT-DIFF (hexe 48/38 vs Houdini 56/54, fewer beveled elements), see docs/HOUDINI-ORACLE.md."

