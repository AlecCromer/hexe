et union), faces with holes / pinched remainders stay as un-fused fragments, non-closed prims ignored, 1e-6 plane / 1e-5 weld tolerance (absolute), >16384 polys/operand = Failed. Example: examples/boolean.json. Houdini-oracle (H32, real Houdini 20.5): ATTRIB-DIFF (+ORDER-DIFF), see docs/HOUDINI-ORACLE.md."
